name: AWS DEPLOY TO STAGING

on:
  workflow_dispatch:
    inputs:
      seed_mode:
        description: "Seeding: none | keep (add seed data, fails if it already exists) | wipe (DESTRUCTIVE: drop all tables, then seed)"
        type: choice
        options:
          - none
          - keep
          - wipe
        default: none
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  aws-deploy:
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.AWS_DB_HOST }}
      DB_PW: ${{ secrets.AWS_DB_PW }}
      DB_USER: ${{ secrets.AWS_DB_USER }}
      DB_NAME: ${{ secrets.AWS_DB_NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          # A manual dispatch deploys the ref you dispatched, so a feature
          # branch can be tested on staging without merging first. The
          # PR-close trigger always deploys dev, the integration branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Values are single-quoted. Verified against Compose's env_file parser:
      # an unquoted value truncates at the first " #" (a password of
      # "secret #1" arrives as "secret", surfacing as "Access denied for
      # user"), while a single-quoted one survives intact. The old
      # `echo K = "$V"` form parsed the same as unquoted printf — the spaces
      # around "=" were never the problem; the missing quotes were.
      - name: Write .env for docker compose
        run: |
          set -eu
          write_var() {
            case "$2" in
              *"'"*)
                echo "::error::$1 contains a single quote and cannot be written safely to .env"
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$1" "$2" >> .env
          }
          : > .env
          write_var DB_HOST "$DB_HOST"
          write_var DB_USER "$DB_USER"
          write_var DB_PW "$DB_PW"
          write_var DB_NAME "$DB_NAME"
          write_var SECRET_KEY "$SECRET_KEY"

      # Assembles deploy/, which becomes the Docker build context on the box.
      - run: npm run bundle

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v2.1.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "deploy/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ubuntu
          TARGET: "nodeapps/sprintboard-system-backend"

      # The 6.6GB root volume ran to 95% full, which broke apt and blocked the
      # Docker install. Reclaim space and repair dpkg before anything else.
      - name: Preflight — disk space and apt health
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            echo "===== disk before ====="
            df -h /
            echo "===== biggest consumers ====="
            sudo du -xh --max-depth=2 /var /home /usr 2>/dev/null | sort -rh | head -25

            echo "===== repairing apt ====="
            sudo dpkg --configure -a || true
            sudo apt-get --fix-broken install -y || true

            echo "===== reclaiming space ====="
            sudo apt-get clean
            sudo journalctl --vacuum-size=50M || true
            sudo apt-get autoremove --purge -y || true
            # Old deploy tree: rsync --delete leaves node_modules behind because
            # it never existed in the bundle.
            rm -rf ~/nodeapps/sprintboard-system-backend/node_modules || true

            # Superseded snap revisions are a routine multi-hundred-MB hog on
            # Ubuntu and survive apt cleanup entirely.
            sudo snap set system refresh.retain=2 2>/dev/null || true
            sudo snap list --all 2>/dev/null | awk '/disabled/{print $1, $3}' \
              | while read -r name rev; do sudo snap remove "$name" --revision="$rev" || true; done

            # Package index caches; regenerated by the next apt-get update.
            sudo rm -rf /var/lib/apt/lists/* || true

            # The retired workflow ran `npm ci` on this box for months, so the
            # npm cache is often the single largest reclaimable directory.
            rm -rf ~/.npm ~/.cache/node-gyp ~/.node-gyp || true
            sudo rm -rf /root/.npm || true

            # Leftover dependency trees from any other app deployed here.
            find ~/nodeapps -maxdepth 3 -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true

            # Rotated/compressed logs that journald's vacuum does not touch.
            sudo find /var/log -type f \( -name '*.gz' -o -name '*.1' -o -name '*.old' \) -delete 2>/dev/null || true
            sudo rm -rf /var/cache/snapd/* /var/tmp/* || true

            # Old kernels left behind in /boot when autoremove misses them.
            sudo apt-get purge -y $(dpkg -l 'linux-image-*' 2>/dev/null \
              | awk '/^ii/{print $2}' | grep -v "$(uname -r)" | head -5) 2>/dev/null || true

            echo "===== disk after ====="
            df -h /
            echo "===== still-large directories (not auto-removed) ====="
            sudo du -sh /var/lib/mysql /var/www /var/log /var/lib/snapd /home/ubuntu 2>/dev/null || true

      # get.docker.com may not publish a repo for Ubuntu 26.04's codename yet,
      # so prefer the distro packages and fall back to the convenience script.
      - name: Install Docker
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            set -e
            # No early `exit 0` here. action-ssh never reaches its completion
            # handler if the remote script exits mid-way, so the step gets
            # marked failed and every later step is skipped. Use if/else.
            if command -v docker >/dev/null && docker compose version >/dev/null 2>&1; then
              echo "Docker already present:"
              docker --version
              docker compose version
            else
              # Measured, backend stack only: docker engine ~500MB, mariadb:11
              # 465MB, backend image 337MB, DB volume ~150MB, npm ci build layer
              # ~300MB transient. Peak ~1.75GB, settling to ~1.45GB after the
              # prune at the end of the deploy. 1800MB is deliberately tight —
              # a clean failure here beats an ENOSPC halfway through a build.
              AVAIL=$(df --output=avail -BM / | tail -1 | tr -dc '0-9')
              echo "Available on /: ${AVAIL}MB"
              if [ "$AVAIL" -lt 1800 ]; then
                # Deliberate failure — this one SHOULD stop the deploy.
                echo "::error::Only ${AVAIL}MB free on /, need ~1800MB for the backend stack. Try dispatching with purge_host_mysql=true, or grow the EBS volume."
                exit 1
              fi

              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2 \
                || curl -fsSL https://get.docker.com | sudo sh

              sudo systemctl enable --now docker
              docker --version
              docker compose version
            fi

      # Every command here is idempotent and safe to re-run: with no SSH access
      # to the box, this workflow is the only way to reach it.
      - name: Bring up the stack
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            set -e
            cd nodeapps/sprintboard-system-backend
            chmod 600 .env

            # Retire the old systemd deployment this replaces.
            sudo systemctl disable --now sprintboard-system-backend || true
            sudo rm -f /lib/systemd/system/sprintboard-system-backend.service
            sudo systemctl daemon-reload

            # Free RAM and port 3306. Disabled, not just stopped, so a reboot
            # does not resurrect it alongside the MariaDB container.
            sudo systemctl disable --now mysql || true
            sudo systemctl disable --now mariadb || true

            COMPOSE="docker compose -f docker-compose.yaml -f docker-compose.prod.yaml"

            # Prune BEFORE building too. Otherwise the previous run's dangling
            # layers and build cache are still on disk during the new build,
            # inflating the peak on an already-tight volume. Images in use by
            # running containers are protected, so this cannot pull the stack
            # out from under itself.
            echo "----- docker usage before -----"
            sudo docker system df
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            sudo docker container prune -f || true
            sudo docker network prune -f || true
            df -h /

            sudo $COMPOSE up -d --build

            # Repeated --build deploys accumulate layers fast on a 6.6GB disk.
            # NEVER add --volumes to any of these: that would destroy the database.
            sudo docker builder prune -af
            sudo docker image prune -af
            sudo docker container prune -f
            echo "----- docker usage after -----"
            sudo docker system df
            df -h /

      # init-db is NOT idempotent: user.email is unique and scripts/init-db.js
      # exits 1 on any error, so `keep` collides with any pre-existing row
      # holding a seed email — whether from an earlier seed or a hand-created
      # user. `wipe` drops every table first, which is the way out of that.
      # Leave this at none on ordinary deploys.
      - name: Seed database (opt-in)
        if: ${{ inputs.seed_mode == 'keep' || inputs.seed_mode == 'wipe' }}
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "ubuntu@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            set -e
            cd nodeapps/sprintboard-system-backend
            COMPOSE="docker compose -f docker-compose.yaml -f docker-compose.prod.yaml"
            echo "Seeding mode: ${{ inputs.seed_mode }}"
            sudo $COMPOSE run --rm backend npm run init-db:${{ inputs.seed_mode }}
