# AWS staging only. Applied explicitly:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
# Passing -f suppresses docker-compose.override.yaml, so none of the local
# dev conveniences (wipe-on-boot, published DB port) leak into staging.
services:
  backend:
    environment:
      DB_HOST: db
      DB_USER: root
      NODE_ENV: production
    ports:
      - "127.0.0.1:3200:3200"

  db:
    # No ports mapping: nothing outside the host should reach 3306.
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PW}
      MARIADB_DATABASE: ${DB_NAME}
