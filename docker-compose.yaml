version: '3.8'

services:
  backend:
    build: .
    container_name: backend
    ports:
      - "3200:3200"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run init-db:wipe && npm start"
    networks:
      - jira_network

  # MariaDB Database Service
  db:
    image: mariadb:11
    container_name: mariadb_db
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      # Maps variables from your host's .env file into MariaDB config
      - MARIADB_ROOT_PASSWORD=${DB_PW}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_PASSWORD=${DB_PW}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jira_network

# Persistent volume so data is not lost when containers stop
volumes:
  mariadb_data:
networks:
  jira_network:
    name: jira_backend_network