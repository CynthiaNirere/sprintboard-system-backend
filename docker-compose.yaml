services:
  backend:
    build: .
    container_name: backend
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp:3201/mcp
    depends_on:
      db:
        condition: service_healthy

    command: npm start
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jira_network

  mcp:
    build: .
    container_name: mcp
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: npx tsx mcp/server.js
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jira_network

  # MariaDB Database Service
  db:
    image: mariadb:11
    container_name: mariadb_db
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PW}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_PASSWORD=${DB_PW}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jira_network

volumes:
  mariadb_data:
networks:
  jira_network:
    name: jira_backend_network
